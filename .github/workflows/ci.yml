name: CI/CD Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            - name: Type Check (TypeScript)
              run: npm run type-check

            - name: Run Unit Tests
              run: npm test

            - name: Build frontend
              run: npm run build

            - name: Upload Build Artifacts
              if: success()
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-build
                  path: dist/
